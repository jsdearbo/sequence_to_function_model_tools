[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-foundation-model-tools"
version = "0.1.0"
description = "Tools for training, fine-tuning, and interpreting genomic sequence-to-function models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jake Dearborn", email = "jakedearborn@gmail.com"},
]
keywords = ["genomics", "sequence-models", "fine-tuning", "lora", "splicing", "foundation-models", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/jsdearbo/sequence_to_function_model_tools"
"Bug Tracker" = "https://github.com/jsdearbo/sequence_to_function_model_tools/issues"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
full = [
    "grelu",
    "pysam",
    "pyranges",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["seq_tools*", "training*", "interpret*"]
